# Beepstock: one compose file for your PC and for a server. Settings come from a .env file next to it (see .env.example).
#
#   Server (only this file and the .env, prebuilt image):   docker compose up -d
#                                            update later:   docker compose pull && docker compose up -d
#   Local, from a checkout (builds the image itself):        docker compose up -d --build
#
# Required in the .env: POSTGRES_PASSWORD. Recommended on a server: TLS_HOSTS (phone camera) and API_TOKEN.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: pantry
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry"]
      interval: 5s
      retries: 10
    logging: *logging

  app:
    # Prebuilt by GitHub Actions (.github/workflows/ci.yml). "--build" builds it from this folder instead.
    image: ${BEEPSTOCK_IMAGE:-ghcr.io/teamoweekend/beepstock:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pantry:${POSTGRES_PASSWORD}@db:5432/pantry
      API_TOKEN: ${API_TOKEN:-}          # optional: protects /api and /ws
      TZ: ${TZ:-Europe/Berlin}
      MODE_IDLE_MINUTES: ${MODE_IDLE_MINUTES:-0}   # fall back to DEFAULT_MODE after N idle minutes (0 = never)
      DEFAULT_MODE: ${DEFAULT_MODE:-consume}
      HTTPS_PORT: 8443                    # needed for the phone camera scanner (browsers require HTTPS for the camera)
      TLS_HOSTS: ${TLS_HOSTS:-}           # host name / LAN IP of this server, e.g. server.example.lan,192.168.1.10 (comma separated)
    ports:
      - "${BEEPSTOCK_PORT:-8080}:8080"
      - "${BEEPSTOCK_HTTPS_PORT:-8443}:8443"
    volumes:
      - certs:/data/certs
      - images:/data/images   # local copies of product images
      - backups:/data/backups # automatic safety backups before imports
    logging: *logging

volumes:
  pgdata:
  certs:
  images:
  backups:
