; Beepstock scanner bridge (BLE HID scanner -> WiFi -> Beepstock)
; Open THIS folder (firmware/) in VS Code so PlatformIO activates.
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv   ; ~3 MB app partition (no OTA); the default 1.3 MB is nearly full
upload_speed = 115200
; upload_port = COM4   ; set your own serial port (see Device Manager); PlatformIO auto-detects it if unset
; monitor_port = COM4
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
